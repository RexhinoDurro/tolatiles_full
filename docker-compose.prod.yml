# Production stack — run on VPS with:
#   infisical run --env=prod -- docker-compose -f docker-compose.prod.yml up -d --build
#
# Nginx on the host proxies to:
#   - backend  → 127.0.0.1:8000
#   - frontend → 127.0.0.1:3000
#
# The existing Nginx config in DEPLOYMENT.md requires no changes.

name: tolatiles-prod

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_DEBUG: "False"
  DATABASE_URL: ${DATABASE_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  REDIS_HOST: ${REDIS_HOST:-localhost}
  FRONTEND_URL: ${FRONTEND_URL:-https://tolatiles.com}
  WORKMAIL_PASS: ${WORKMAIL_PASS}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GEMINI_IMAGE_API_KEY: ${GEMINI_IMAGE_API_KEY}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
  VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL:-menitola@tolatiles.com}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN}
  GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID}
  GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID}
  GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID}
  GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET}
  GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
  GOOGLE_PLACE_ID: ${GOOGLE_PLACE_ID}
  CAPI_ACCESS_TOKEN: ${CAPI_ACCESS_TOKEN}
  CAPI_TEST_EVENT_CODE: ${CAPI_TEST_EVENT_CODE}
  R2_BUCKET_NAME: ${R2_BUCKET_NAME}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
  R2_PUBLIC_URL: ${R2_PUBLIC_URL}
  R2_FINANCIAL_BUCKET_NAME: ${R2_FINANCIAL_BUCKET_NAME}
  R2_FINANCIAL_ACCESS_KEY_ID: ${R2_FINANCIAL_ACCESS_KEY_ID}
  R2_FINANCIAL_SECRET_ACCESS_KEY: ${R2_FINANCIAL_SECRET_ACCESS_KEY}
  # Optional in Infisical (settings.py falls back to 86400 if truly unset) --
  # but os.environ.get()'s default only applies when the key is absent, not
  # present-with-an-empty-value, and Compose substitutes an unset var as ''
  # rather than omitting the key. Needs its own fallback here or the container
  # crash-loops on `int('')` the moment this secret isn't set.
  R2_FINANCIAL_URL_EXPIRE_SECONDS: ${R2_FINANCIAL_URL_EXPIRE_SECONDS:-86400}

services:
  backend:
    build:
      context: ./server
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - /home/ubuntu/tolatiles_full/server/media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - tolatiles_full_default

  celery:
    build:
      context: ./server
    command: celery -A config worker --loglevel=info
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - /home/ubuntu/tolatiles_full/server/media:/app/media
    networks:
      - default
      - tolatiles_full_default

  celery-beat:
    build:
      context: ./server
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    environment:
      <<: *backend-env
    networks:
      - default
      - tolatiles_full_default

  frontend:
    build:
      context: ./client
      target: runner
      # NEXT_PUBLIC_* vars are already correct in .env.production (committed).
      # Only set build args here if you need to override them.
    restart: unless-stopped
    environment:
      # Server-side data fetching uses this to reach Django directly over the
      # Docker network instead of hairpinning through nginx at tolatiles.com,
      # which shares nginx's per-IP rate limit with real visitor traffic.
      INTERNAL_API_URL: http://backend:8000/api
    ports:
      - "127.0.0.1:3000:3000"

  # Tagging server — receives live traffic at metrics.tolatiles.com
  gtm-server:
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:stable
    restart: unless-stopped
    environment:
      CONTAINER_CONFIG: ${GTM_CONTAINER_CONFIG}
      PREVIEW_SERVER_URL: ${PREVIEW_SERVER_URL}
    ports:
      - "127.0.0.1:8080:8080"

  # Preview server — serves the GTM debug/preview UI at sgtm-preview.metrics.tolatiles.com
  gtm-preview-server:
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:stable
    restart: unless-stopped
    environment:
      CONTAINER_CONFIG: ${GTM_CONTAINER_CONFIG}
      RUN_AS_PREVIEW_SERVER: "true"
    ports:
      - "127.0.0.1:8081:8080"

networks:
  tolatiles_full_default:
    external: true
